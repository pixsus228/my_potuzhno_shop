name: ПОТУЖНО Shop CI Pipeline

on:
  push:
    branches: [ "feat/final-submission", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: potuzhno_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run database migrations
      env:
        DB_NAME: potuzhno_test
        DB_USER: postgres
        DB_PASSWORD: password123
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        python manage.py migrate
    - name: Run pytest
      env:
        DB_NAME: potuzhno_test
        DB_USER: postgres
        DB_PASSWORD: password123
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        python -m pytest