{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 border border-gray-700 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-2xl font-black text-white mb-6 text-center">Зміна пароля 🔒</h2>
    <form method="post" class="space-y-5">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-semibold text-gray-300 mb-2">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <p class="text-gray-500 text-xs mt-1">{{ field.help_text|safe }}</p>
            {% endif %}
            {% if field.errors %}
            <p class="text-rose-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-xl transition shadow-lg mt-2">Оновити пароль</button>
    </form>
</div>
{% endblock %}
