{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 border border-gray-700 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-2xl font-black text-white mb-6">Редагувати відгук 📝</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-lg transition shadow">Зберегти відгук</button>
    </form>
</div>
{% endblock %}
