{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-2xl font-black text-white mb-6">{% if product %}Редагувати товар{% else %}Створити товар{% endif %}</h2>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="flex gap-4 pt-4">
            <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition">Зберегти</button>
            {% if product and product.slug %}
                <a href="{% url 'shop:product_detail' product.slug %}" class="bg-slate-800 text-white px-6 py-3 rounded-xl">Скасувати</a>
            {% else %}
                <a href="{% url 'shop:product_list' %}" class="bg-slate-800 text-white px-6 py-3 rounded-xl">Скасувати</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
